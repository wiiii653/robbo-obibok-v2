# Robbo Obibok v2 — Configuration
# This is the operator configuration loaded by default. For a minimal template,
# see config.example.yaml if present.

# Discord bot token must be provided via DISCORD_BOT_TOKEN.

# Command prefix (default: !)
command_prefix: "!"

# Optional: restrict bot to a single Discord server (guild ID)
guild_id: 1470009221117382689

# Audio settings
audio:
  sink_name: "robbo_bot"

# Playback
# loop: true is an intentional operator override of the code default (False).
playback:
  loop: true  # true = loop queue (wrap to start when playlist ends)
  shuffle: true

# Archive storage path (relative to project root)
archive:
  path: "archiwum"

# Auto-start / Auto-stop
auto:
  start_channel: "Chiptune Radio"  # voice channel name to auto-start (empty = disabled)
  empty_timeout: 60  # seconds before disconnect when channel is empty

# Per-format volume overrides (extension → volume percentage, default: 100)
format_volumes:
  sid: 115
  mod: 115
  xm: 115
  s3m: 115
  it: 115
