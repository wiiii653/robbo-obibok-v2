# Robbo Obibok v2 — example configuration
# Copy to config.yaml and adjust for your host:
#   cp config.example.yaml config.yaml
#
# The Discord bot token is NEVER stored here — provide it via the
# DISCORD_BOT_TOKEN environment variable (see .env.example).

# Command prefix (default: !)
command_prefix: "!"

# Optional: restrict the bot to a single Discord server (guild ID).
# Must be a POSITIVE INTEGER when set, or omitted entirely (leave commented).
# An empty string is INVALID and will abort startup.
# guild_id: 123456789012345678

# Audio settings
audio:
  sink_name: "robbo_bot"

# Playback
playback:
  loop: true      # true = loop queue (wrap to start when the playlist ends)
  shuffle: true

# Archive storage path — absolute path to the local chiptune archive.
archive:
  path: "/path/to/robbo-music"

# Auto-start / auto-stop
auto:
  start_channel: "Chiptune Radio"  # voice channel name to auto-start (empty = disabled)
  empty_timeout: 60                # seconds before disconnect when the channel is empty

# Per-format volume overrides (file extension → volume percentage, default: 100)
#
# These are PulseAudio/PipeWire SINK volumes (applied with `pactl set-sink-volume`
# when a track starts) — NOT the Audacious master volume.
#
# ⚠️ Two gain stages stack: Audacious output volume × this sink volume.
# The Audacious slider lives in ~/.config/audacious/config ([pipewire]
# volume_left/volume_right) and the bot never touches it. Its scale is
# strongly non-linear: measured on a live stream, 90 → 100% is worth
# **+5.3 dB** (not +0.9 dB), so leave it at 100 unless you have a reason.
#
# Extensions missing from this map stay at 100% — which means the quieter
# collections (.sap, .ay, .ym, .nsf) get no lift at all. Measured on a
# running bot: tracker modules land at ~-16 LUFS (roughly mastered-MP3
# loudness: -14…-15 LUFS), while ASMA/SAP sits ~5 dB lower. Raise those
# entries (e.g. `sap: 150`) if your listeners complain.
format_volumes:
  sid: 115
  mod: 115
  xm: 115
  s3m: 115
  it: 115
