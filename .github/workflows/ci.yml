name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # is_junk_path() rejects any path with a dot-prefixed component, and pytest
    # derives tmp_path from TMPDIR — a dotted temp dir fails four tests for
    # reasons unrelated to the code. conftest.py normalises this too; pinning it
    # here keeps CI independent of the runner's environment.
    env:
      TMPDIR: /tmp
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
      - run: pytest -q --cov=src --cov-report=term-missing
      - run: python -m build
      # PYSEC-2026-3002 (PyNaCl 1.5.0) ignorowane: discord.py 2.7.1 (najnowsza) wymusza PyNaCl<1.6
      - run: pip-audit --ignore-vuln PYSEC-2026-3002
