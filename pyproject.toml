[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robbo-obibok"
version = "2.0.0"
description = "Discord chiptune radio bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.3,<3",
    "pynacl>=1.5,<1.6",
    "pyyaml>=6.0,<7",
    # pin aiohttp: PYSEC-2026-3545/46/47 (fix 3.14.3); discord.py allows aiohttp<4,>=3.7.4
    "aiohttp>=3.14.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=5,<7",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "build>=1,<2",
    "pip-audit>=2,<3",
    # Python 3.11 venv (ensurepip) wnosi setuptools 79.0.1 (PYSEC-2026-3447);
    # pin wymusza podniesienie do wersji załatanej — inaczej pip-audit pada.
    "setuptools>=83.0.0",
]

[project.scripts]
robbo-obibok = "src.launcher:main"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires host audio dependencies and is opt-in",
]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:discord.ext.commands.core",
]

# pip-audit: ignorowane podatności (akceptowane ryzyko z komentarzem)
[tool.pip-audit]
# PYSEC-2026-3002 (PyNaCl 1.5.0 -> fix 1.6.2): NIE da się podbić — discord.py 2.7.1
# (najnowsza) wymusza PyNaCl<1.6,>=1.5.0 przy extras voice. Fix wymagałby nowszej
# discord.py, która nie istnieje. Do przeglądu po upgrade discord.py.
ignore-vulns = [
    "PYSEC-2026-3002",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
